version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-sk-cp-ZCwysUdUK1bPpueFdYe-yr97Q9-mRKFFNP8q1WYNcsIBrR_eT9nuHWEz0EKPPy3s7xAjvUvUCxcf_jShb6XCd674oPOZm5aantIXyAn4Fexo-qTYyNhvxkc}
      - MINIMAX_BASE_URL=${MINIMAX_BASE_URL:-http://10.68.46.180:31943}
    volumes:
      - ../mbti-multi-agent:/app/mbti-multi-agent
    # 允许外部访问
    networks:
      - mbti-network

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    # 允许外部访问
    networks:
      - mbti-network

networks:
  mbti-network:
    driver: bridge